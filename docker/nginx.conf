worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Belt and suspenders; the app sets these too
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 256;

    client_max_body_size 10M;

    # Re-resolve the app on Docker's DNS: a redeploy can hand it a new IP, and a
    # name resolved once at startup turns that into a 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $host $app_upstream { default http://app:8000; }

    # Public plain HTTP: health checks pass, everyone else goes to HTTPS.
    # Client-sent X-Forwarded-* headers are never trusted here.
    server {
        listen 80;
        location ~* ^/healthz?$ {
            proxy_pass $app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Load balancer listener. Only published on the WireGuard bind IP, so the
    # only peers that can reach it are the LB nodes. The LB terminates TLS and
    # appends the real client IP as the LAST X-Forwarded-For entry. That entry is
    # believed only from the LB addresses in LB_TRUSTED_IPS (nginx-lb-trusted.sh
    # writes them); any other peer, such as another container on the Docker
    # network, is seen as itself.
    server {
        listen 8085;
        include /etc/nginx/lb_trusted*.conf;   # a glob: no file, no trust, nginx still starts
        real_ip_header X-Forwarded-For;
        real_ip_recursive off;

        location / {
            proxy_pass $app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # Backup uploads for Admin > Maintenance: big, and streamed straight through
        location = /api/v1/admin/maintenance/uploads {
            client_max_body_size 64g;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass $app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Direct HTTPS access
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location / {
            proxy_pass $app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # Backup uploads for Admin > Maintenance: big, and streamed straight through
        location = /api/v1/admin/maintenance/uploads {
            client_max_body_size 64g;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass $app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /static/ {
            proxy_pass $app_upstream;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400";
        }
    }
}
