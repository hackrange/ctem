services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ctem]
    restart: unless-stopped
    volumes:
      - app_uploads:/app/uploads

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A api.core.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ctem]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A api.core.tasks.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A api.core.tasks.celery_app beat --loglevel=info
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ctem]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q beat /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-openctem}
      POSTGRES_USER: ${DB_USER:-openctem}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required -- run install.sh}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [ctem]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openctem}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required -- run install.sh}
      --appendonly yes
    volumes:
      - redis_data:/data
    networks: [ctem]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
      - "${LB_BIND_IP:-127.0.0.1}:8085:8085"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [app]
    networks: [ctem]
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  app_uploads:

networks:
  ctem:
    driver: bridge
