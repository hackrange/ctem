services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ctem]
    restart: unless-stopped
    volumes:
      - app_uploads:/app/uploads

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A api.core.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ctem]
    restart: unless-stopped

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A api.core.tasks.celery_app beat --loglevel=info
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ctem]
    restart: unless-stopped

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: openctem
      POSTGRES_USER: openctem
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_set_in_env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [ctem]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openctem"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_set_in_env} --appendonly yes
    volumes:
      - redis_data:/data
    networks: [ctem]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on: [app]
    networks: [ctem]
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  app_uploads:
  nginx_certs:

networks:
  ctem:
    driver: bridge
