{% extends "base.html" %}
{% set active_nav = 'vulns' %}

{% block title %}Vulnerabilities -- open-ctem{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-header__title">Vulnerabilities</h1>
    <p class="page-header__sub">All CVEs and scanner findings across your environment</p>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div class="search-bar-wrap">
      <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="search-input" type="search" class="search-bar" placeholder="Title, CVE, or scanner ID (partial ok)" autocomplete="off" aria-label="Search vulnerabilities">
    </div>
    <select id="filter-kev" class="filter-select" aria-label="KEV">
      <option value="">KEV: any</option>
      <option value="true">KEV only</option>
      <option value="false">Not KEV</option>
    </select>
    <select id="filter-cvss" class="filter-select" aria-label="Minimum CVSS">
      <option value="">Any CVSS</option>
      <option value="9">9.0+ critical</option>
      <option value="7">7.0+ high</option>
      <option value="4">4.0+ medium</option>
    </select>
    <select id="filter-source" class="filter-select" aria-label="Source">
      <option value="">All sources</option>
      <option value="rapid7_insightvm">Rapid7 InsightVM</option>
      <option value="rapid7_appsec">Rapid7 AppSec</option>
      <option value="rapid7_cloudsec">Rapid7 CloudSec</option>
    </select>
    <label class="text-sm" style="display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="filter-affected" checked> With affected devices
    </label>
    <button type="button" id="ex-btn" class="btn btn--primary btn--sm" hidden disabled>Create exception</button>
  </div>
</div>

<div class="panel" style="padding:0" id="vulns-table"></div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ static('js/data_table.js') }}"></script>
<script src="{{ static('js/exception_modal.js') }}"></script>
<script>
const R = DataTable.R;
const $ = id => document.getElementById(id);
const FILTERS = { q: 'search-input', is_kev: 'filter-kev', min_cvss: 'filter-cvss', source: 'filter-source' };

const initial = new URLSearchParams(location.search);
Object.entries(FILTERS).forEach(([k, id]) => { if (initial.get(k)) $(id).value = initial.get(k); });
if (initial.has('affected_only')) $('filter-affected').checked = initial.get('affected_only') === 'true';

const href = v => `/vulns/${encodeURIComponent(v.id)}`;
const muted = '<span class="text-muted">--</span>';

// Admin and cyber tick vulnerabilities (picks survive paging and searches) and except them for all devices or a tag
const picked = new Map();   // vuln id -> {vulnId, label}
let table, syncPicks;
function pickedLabel() {
  $('ex-btn').disabled = !picked.size;
  $('ex-btn').textContent = `Create exception${picked.size ? ` (${picked.size})` : ''}`;
}
function start(canExcept) {
table = DataTable.create({
  mount: $('vulns-table'),
  endpoint: '/api/v1/vulns',
  exportUrl: '/api/v1/vulns/export',
  listKey: 'vulns',
  defaultSort: 'cvss_base',
  defaultOrder: 'desc',
  syncUrl: true,
  emptyText: 'No vulnerabilities match these filters',
  rowHref: href,
  params: () => ({
    q: $('search-input').value.trim(), is_kev: $('filter-kev').value, min_cvss: $('filter-cvss').value,
    source: $('filter-source').value, affected_only: $('filter-affected').checked ? 'true' : 'false',
  }),
  onLoad: () => syncPicks && syncPicks(),
  columns: [
    ...(canExcept ? [{ label: 'Select', head: CtemFindings.PICK_HEAD,
      render: v => `<input type="checkbox" data-pick="${esc(v.id)}" aria-label="Select ${esc(v.cve_id || v.title)}"${picked.has(v.id) ? ' checked' : ''}>` }] : []),
    { label: 'CVE', sort: 'cve_id', render: v => v.cve_id ? R.link(href(v), v.cve_id) : muted },
    { label: 'Title', sort: 'title', render: v => R.link(href(v), v.title) },
    { label: 'CVSS', sort: 'cvss_base', firstOrder: 'desc', render: v => v.cvss_base == null ? muted : esc(v.cvss_base) },
    { label: 'EPSS', sort: 'epss_score', firstOrder: 'desc', render: v => v.epss_score == null ? muted : esc((v.epss_score * 100).toFixed(1) + '%') },
    { label: 'KEV', sort: 'is_kev', firstOrder: 'desc', render: v => v.is_kev ? '<span class="chip chip--critical">KEV</span>' : '' },
    { label: 'Exploit', sort: 'exploit_available', firstOrder: 'desc', render: v => v.exploit_available ? '<span class="chip chip--high">Yes</span>' : '' },
    { label: 'Affected', sort: 'affected', firstOrder: 'desc', render: v => R.num(v.affected_devices) },
    { label: 'Source', sort: 'source', render: v => `<span class="text-sm text-muted">${esc(v.source)}</span>` },
  ],
});
}

syncPicks = CtemFindings.picker({
  mount: $('vulns-table'), rows: () => (table ? table.rows() : []), picked, onChange: pickedLabel,
  entry: v => ({ vulnId: v.id, label: v.cve_id || v.title }),
});
$('ex-btn').addEventListener('click', () => CtemFindings.exceptionForm({
  vulns: [...picked.values()], canDecide: true,
  onDone: () => { picked.clear(); pickedLabel(); table && table.reload(false); },
}));

let timer;
$('search-input').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => table && table.reload(), 300); });
['filter-kev', 'filter-cvss', 'filter-source', 'filter-affected'].forEach(id => $(id).addEventListener('change', () => table && table.reload()));
fetch('/api/v1/exceptions/summary', { headers: { Accept: 'application/json' } })
  .then(r => (r.ok ? r.json() : {})).catch(() => ({}))
  .then(s => { const can = !!s.can_decide; $('ex-btn').hidden = !can; start(can); });
</script>
{% endblock %}
