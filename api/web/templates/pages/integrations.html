{% extends "base.html" %}
{% set active_nav = 'integrations' %}

{% block title %}Integrations -- open-ctem{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-header__title">Integrations</h1>
    <p class="page-header__sub">Configure vendor connectors and sync schedules</p>
  </div>
  <button class="btn btn--primary btn--sm" onclick="openAddModal()">+ Add Integration</button>
</div>

<div id="integrations-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px">
  <div class="text-muted text-sm" style="grid-column:1/-1;padding:32px;text-align:center">Loading...</div>
</div>

<!-- Add/edit integration modal -->
<div id="int-modal" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.5);align-items:center;justify-content:center">
  <div style="background:var(--surface);border-radius:8px;padding:28px;width:100%;max-width:520px;box-shadow:0 8px 32px rgba(0,0,0,.3)">
    <h2 style="margin:0 0 16px;font-size:1.1rem" id="modal-title">Add Integration</h2>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label style="font-size:.8rem;font-weight:600;display:block;margin-bottom:4px">Vendor</label>
        <select id="int-vendor" onchange="updateVendorFields()"
          style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)">
          <option value="">Select...</option>
        </select>
      </div>
      <div>
        <label style="font-size:.8rem;font-weight:600;display:block;margin-bottom:4px">Label</label>
        <input id="int-label" type="text" placeholder="e.g. Production Qualys"
          style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)">
      </div>
      <div id="int-config-fields"></div>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.9rem">
        <input type="checkbox" id="int-enabled" checked> Enabled
      </label>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end">
      <button class="btn btn--ghost btn--sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn--primary btn--sm" onclick="saveIntegration()">Save</button>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const API = '/api/v1';

async function fetchJson(url) {
  const res = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!res.ok) throw new Error(res.statusText);
  return res.json();
}

function statusChip(enabled, last_sync) {
  if (!enabled) return '<span class="chip chip--info">Disabled</span>';
  if (!last_sync) return '<span class="chip chip--medium">Never synced</span>';
  return '<span class="chip chip--low">Active</span>';
}

async function loadIntegrations() {
  try {
    const data = await fetchJson(`${API}/integrations`);
    const list = data.integrations || [];
    const grid = document.getElementById('integrations-grid');
    if (!list.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--text-muted)">No integrations configured. Add one to start syncing data.</div>';
      return;
    }
    grid.innerHTML = list.map(i => `
      <div class="panel" style="margin:0">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
          <div>
            <div style="font-weight:600">${i.label || i.vendor}</div>
            <div class="text-muted text-sm">${i.vendor}</div>
          </div>
          ${statusChip(i.is_enabled, i.last_sync_at)}
        </div>
        <div class="text-muted text-sm" style="margin-bottom:12px">
          Last sync: ${i.last_sync_at ? new Date(i.last_sync_at).toLocaleString() : 'Never'}
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn--ghost btn--sm" onclick="triggerSync('${i.id}')">Sync Now</button>
          <button class="btn btn--ghost btn--sm" onclick="editIntegration('${i.id}')">Edit</button>
          <button class="btn btn--ghost btn--sm" style="color:var(--severity-critical)" onclick="deleteIntegration('${i.id}')">Remove</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('integrations-grid').innerHTML = `<div style="grid-column:1/-1;padding:32px;text-align:center;color:var(--text-muted)">Error loading integrations</div>`;
  }
}

async function triggerSync(id) {
  try {
    await fetch(`${API}/integrations/${id}/sync`, { method: 'POST' });
    setTimeout(loadIntegrations, 1000);
  } catch (_) {}
}

function openAddModal() {
  document.getElementById('int-modal').style.display = 'flex';
  loadVendorOptions();
}

function closeModal() { document.getElementById('int-modal').style.display = 'none'; }

async function loadVendorOptions() {
  try {
    const data = await fetchJson(`${API}/integrations/vendors`);
    const sel = document.getElementById('int-vendor');
    sel.innerHTML = '<option value="">Select...</option>';
    (data.vendors || []).forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id;
      opt.textContent = v.name;
      sel.appendChild(opt);
    });
  } catch (_) {}
}

function updateVendorFields() {
  // Field schema comes from vendor metadata -- placeholder for now
  document.getElementById('int-config-fields').innerHTML = `
    <div>
      <label style="font-size:.8rem;font-weight:600;display:block;margin-bottom:4px">Base URL</label>
      <input type="text" placeholder="https://..." style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)">
    </div>
    <div>
      <label style="font-size:.8rem;font-weight:600;display:block;margin-bottom:4px">API Key / Token</label>
      <input type="password" placeholder="..." style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)">
    </div>`;
}

async function saveIntegration() {
  closeModal();
  loadIntegrations();
}

async function deleteIntegration(id) {
  if (!confirm('Remove this integration?')) return;
  await fetch(`${API}/integrations/${id}`, { method: 'DELETE' });
  loadIntegrations();
}

document.addEventListener('DOMContentLoaded', loadIntegrations);
document.addEventListener('click', e => { if (e.target.id === 'int-modal') closeModal(); });
</script>
{% endblock %}
