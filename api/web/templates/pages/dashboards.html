{% extends "base.html" %}
{% set active_nav = 'dashboards' %}

{% block title %}Dashboards -- open-ctem{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-header__title">Dashboards</h1>
    <p class="page-header__sub">Build your own from ready-made widgets, share them, and star the ones you use</p>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <div class="search-bar-wrap">
      <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="dl-search" type="search" class="search-bar" placeholder="Search dashboards" aria-label="Search dashboards">
    </div>
    <button type="button" id="dl-new" class="btn btn--primary btn--sm">New dashboard</button>
  </div>
</div>
<div id="dl-tabs" role="tablist" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
<div id="dl-list" class="dl-grid"><div class="text-muted text-sm">Loading...</div></div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ static('js/dash_render.js') }}"></script>
<script src="{{ static('js/dashboards.js') }}"></script>
{% endblock %}
