{% extends "base.html" %}
{% set active_nav = 'threat' %}

{% block title %}Cyber Threats -- open-ctem{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-header__title">Cyber Threats</h1>
    <p class="page-header__sub">Alerts from your EDR, SIEM and firewalls, worst first</p>
  </div>
</div>

<div class="panel" style="padding:0">
  <div class="panel__header" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <div class="search-bar-wrap">
      <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="search-input" type="search" class="search-bar" placeholder="Alert, host, MITRE ID or tactic" aria-label="Search alerts">
    </div>
    <select id="filter-severity" class="filter-select" aria-label="Severity">
      <option value="">Any severity</option>
      <option value="critical">Critical</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
      <option value="informational">Informational</option>
    </select>
    <select id="filter-status" class="filter-select" aria-label="Status"><option value="">Any status</option></select>
    <select id="filter-source" class="filter-select" aria-label="Source"><option value="">All sources</option></select>
    <label class="text-sm" style="display:flex;align-items:center;gap:6px;cursor:pointer" title="Alerts you hid are hidden for you only">
      <input type="checkbox" id="show-hidden"> <span id="show-hidden-label">Show hidden</span></label>
  </div>
  <div id="threats-table"></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ static('js/data_table.js') }}"></script>
<script src="{{ static('js/threat_common.js') }}"></script>
<script>
const R = DataTable.R;
const $ = id => document.getElementById(id);
const T = ThreatView;

// Prefill from the URL so shared links land on the same view
const initial = new URLSearchParams(location.search);
const FILTERS = { q: 'search-input', severity: 'filter-severity', status: 'filter-status', source: 'filter-source' };
Object.entries(FILTERS).forEach(([k, id]) => { if (initial.get(k)) $(id).value = initial.get(k); });

function fillOnce(id, items) {
  const sel = $(id);
  if (sel.options.length > 1) return;
  const want = initial.get(id === 'filter-source' ? 'source' : 'status') || '';
  items.forEach(([value, label]) => sel.add(new Option(label, value, false, value === want)));
}

const table = DataTable.create({
  mount: $('threats-table'),
  endpoint: '/api/v1/threat/alerts',
  listKey: 'alerts',
  defaultSort: 'severity',
  defaultOrder: 'desc',
  syncUrl: true,
  emptyText: 'No alerts match these filters',
  rowHref: a => T.href(a),
  onLoad: data => {
    $('show-hidden-label').textContent = `Show hidden (${data.hidden_count || 0})`;
    fillOnce('filter-source', (data.sources || []).map(s => [s.code, s.code]));
    fillOnce('filter-status', (data.statuses || []).map(s => [s, T.statusLabel(s)]));
  },
  params: () => ({ q: $('search-input').value.trim(), severity: $('filter-severity').value,
                   status: $('filter-status').value, source: $('filter-source').value, hidden: $('show-hidden').checked ? 'show' : 'hide' }),
  columns: [
    { label: 'Alert', sort: 'title', render: a => `<span style="display:inline-block;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom" title="${esc(a.title || '')}">${R.link(T.href(a), a.title || a.id)}</span>` },
    { label: 'Source', sort: 'source', render: a => T.sourceChip(a) },
    { label: 'Severity', sort: 'severity', firstOrder: 'desc', render: a => T.sevChip(a.severity) },
    { label: 'Device', sort: 'hostname', render: a => T.device(a) },
    { label: 'MITRE', sort: 'technique_id', render: a => T.mitre(a) },
    { label: 'Detected', sort: 'detected_at', firstOrder: 'desc', render: a => T.when(a) },
    { label: 'Status', sort: 'status', render: a => T.statusChip(a.status) },
    { label: '', render: a => `<button type="button" class="btn btn--ghost btn--sm" data-hide="${esc(a.id)}" data-hidden="${a.hidden ? '1' : ''}"
        title="${a.hidden ? 'Show it again in your list' : 'Hide it from your list only'}">${a.hidden ? 'Unhide' : 'Hide'}</button>` },
  ],
});
// Hide or unhide an alert for yourself (kept on your account; nobody else's list changes)
$('threats-table').addEventListener('click', async e => {
  const b = e.target.closest('[data-hide]');
  if (!b) return;
  b.disabled = true;
  await fetch('/api/v1/me/hidden', { method: 'PUT', headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
                                     body: JSON.stringify({ kind: 'alert', id: b.dataset.hide, hidden: !b.dataset.hidden }) }).catch(() => null);
  table.reload(false);
});
$('show-hidden').addEventListener('change', () => table.reload());

let timer;
$('search-input').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => table.reload(), 300); });
['filter-severity', 'filter-status', 'filter-source'].forEach(id => $(id).addEventListener('change', () => table.reload()));
</script>
{% endblock %}
