{% extends "base.html" %}
{% set active_nav = 'vulns' %}

{% block title %}Vulnerability -- open-ctem{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <p class="text-sm"><a href="/vulns" class="dt-link" style="color:var(--fg-muted)">&larr; Vulnerabilities</a></p>
    <div id="tag-focus" class="filter-bar" hidden style="margin:4px 0 8px"></div>
    <h1 class="page-header__title" id="v-title">Loading...</h1>
    <p class="page-header__sub" id="v-sub"></p>
  </div>
  <div id="v-badges" style="display:flex;align-items:center;gap:8px"></div>
</div>

<div class="panel" id="v-info-panel">
  <div class="panel__header"><span class="panel__title">Details</span></div>
  <div class="panel__body">
    <dl id="v-info" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 24px;margin:0 0 12px"></dl>
    <div id="v-desc" class="text-sm" style="white-space:pre-wrap;max-height:240px;overflow:auto"></div>
  </div>
</div>

<div class="panel" style="margin-top:16px" id="v-found-panel" hidden>
  <div class="panel__header"><span class="panel__title">What the scanner found</span><span class="text-sm text-muted" id="v-found-where"></span></div>
  <div class="panel__body" id="v-found"></div>
</div>

<div class="panel" style="padding:0;margin-top:16px" id="v-affected-panel">
  <div class="panel__header" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
    <span class="panel__title" id="v-affected-title">Affected devices</span>
    <span id="v-none-mine" class="text-sm text-muted" style="flex-basis:100%;order:3" hidden role="status"></span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button type="button" id="fp-btn" class="btn btn--ghost btn--sm" hidden disabled>False positive</button>
      <button type="button" id="ex-btn" class="btn btn--primary btn--sm" hidden disabled>Create exception</button>
      <div class="search-bar-wrap">
        <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="a-search" type="search" class="search-bar" placeholder="Hostname or user" aria-label="Search affected devices">
      </div>
      <select id="a-status" class="filter-select" aria-label="Status">
        <option value="active">Open + in progress</option>
        <option value="all">All statuses</option>
        <option value="remediated">Remediated</option>
        <option value="risk_accepted">Risk accepted</option>
        <option value="false_positive">False positive</option>
      </select>
    </div>
  </div>
  <div id="affected-table"></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ static('js/data_table.js') }}"></script>
<script src="{{ static('js/asset_cloud.js') }}"></script>
<script src="{{ static('js/asset_detail.js') }}"></script>
<script src="{{ static('js/ticket_modal.js') }}"></script>
<script src="{{ static('js/exception_modal.js') }}"></script>
<script>
const R = DataTable.R;
const $ = id => document.getElementById(id);
const vulnId = location.pathname.split('/').filter(Boolean).pop();
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const txt = v => v == null || v === '' ? '<span class="text-muted">--</span>' : esc(v);
const info = (label, html) => `<div><dt class="text-sm text-muted">${esc(label)}</dt><dd style="margin:2px 0 0">${html}</dd></div>`;

async function loadVuln() {
  if (!UUID.test(vulnId)) return notFound();
  const fq = new URLSearchParams();
  TagFocus.get().forEach(t => fq.append('tag', t));   // affected count for the tag focus only
  const res = await fetch(`/api/v1/vulns/${encodeURIComponent(vulnId)}${fq.toString() ? '?' + fq : ''}`, { headers: { Accept: 'application/json' } });
  if (!res.ok) return notFound();
  const v = await res.json();
  document.title = `${v.cve_id || v.title} -- open-ctem`;
  $('v-title').textContent = v.cve_id || v.title;
  $('v-sub').textContent = v.cve_id ? v.title : (v.source_vuln_id || '');
  $('v-badges').innerHTML = (v.is_kev ? '<span class="chip chip--critical">CISA KEV</span>' : '')
    + (v.exploit_available ? '<span class="chip chip--high">Exploit available</span>' : '');
  const app = v.domain === 'code' || v.domain === 'web' || v.domain === 'cloud';   // no CVE fields for these
  const SEV_OF = c => (c == null ? null : c >= 9 ? 'critical' : c >= 7 ? 'high' : c >= 4 ? 'medium' : c > 0 ? 'low' : 'info');
  const SRC_NAME = { github_code_review: 'GitHub Code Review', rapid7_cloudsec: 'Rapid7 InsightCloudSec' };
  // Code and Web apps: only what the tool actually gives; host-scanner fields (vector, EPSS, KEV date) are left out when empty
  if (app) {
    const sev = SEV_OF(v.cvss_base);
    $('v-info').innerHTML = [
      info('Grade', sev ? `<span class="chip chip--${esc(sev)}">${esc(sev)}</span>${v.source === 'github_code_review'
        ? ' <span class="text-sm text-muted">as graded in GitHub Code Review</span>' : ''}` : txt(null)),
      v.cvss_vector ? info('CVSS vector', `<span class="text-mono text-sm">${esc(v.cvss_vector)}</span>`) : '',
      v.epss_score != null ? info('EPSS', esc((v.epss_score * 100).toFixed(2) + '%')) : '',
      v.kev_added_date ? info('KEV added', txt(v.kev_added_date)) : '',
      v.attack_vector ? info('Attack vector', txt(v.attack_vector)) : '',
      info(AssetDetail.affectedLabel(v.domain), R.num(v.affected_devices)),
      info('Type', esc({ code: 'Code', web: 'Web app', cloud: 'Cloud' }[v.domain])),
      info('Source', esc(SRC_NAME[v.source] || v.source || '')),
      v.source_vuln_id ? info('Scanner ID', `<span class="text-mono text-sm">${esc(String(v.source_vuln_id).split('@')[0])}</span>`) : '',
      '<span id="v-info-tool" style="display:contents"></span>',
    ].join('');
  } else $('v-info').innerHTML = [
    info('CVSS', txt(v.cvss_base)),
    info('CVSS vector', `<span class="text-mono text-sm">${txt(v.cvss_vector)}</span>`),
    info('EPSS', v.epss_score == null ? txt(null) : esc((v.epss_score * 100).toFixed(2) + '%')),
    info('KEV added', txt(v.kev_added_date)),
    info('Attack vector', txt(v.attack_vector)),
    info(AssetDetail.affectedLabel(v.domain), R.num(v.affected_devices)),
    info('Type', esc({ infra: 'Infrastructure', code: 'Code', web: 'Web app', cloud: 'Cloud' }[v.domain] || 'Infrastructure')),
    info('Source', txt(v.source)),
    info('Scanner ID', `<span class="text-mono text-sm">${txt(v.source_vuln_id)}</span>`),
  ].join('');
  // Scanner descriptions can carry markup; show it as plain text
  $('v-desc').textContent = (v.description || '').replace(/<[^>]*>/g, ' ').replace(/\s+\n/g, '\n').trim();
  vdomain = v.domain;
  vtitle = v.cve_id || v.title;
  vkev = !!v.is_kev;
  $('v-affected-title').textContent = AssetDetail.affectedLabel(v.domain);
  // Someone who sees only some assets: say so plainly when none of theirs have it, rather than an empty table
  const none = $('v-none-mine');
  if (none) {
    none.hidden = !(v.scoped && !v.affected_devices);
    none.textContent = `None of the ${AssetDetail.affectedLabel(v.domain).replace(/^Affected /, '')} you have access to have this vulnerability open. `
      + 'It may be on assets you can\'t see; ask cyber if you think one of yours should be here.';
  }
  if (v.domain === 'code' || v.domain === 'web') $('a-search').placeholder = v.domain === 'code' ? 'Repository' : 'Site';
  if (v.domain === 'cloud') $('a-search').placeholder = 'Resource';
  if (!table) startAffected();
  if (v.domain === 'code' || v.domain === 'web' || v.domain === 'cloud') showFound(v);   // cloud: where it is and how to fix it
}

// For Code and Web app findings: the scanner's write-up, evidence and fix, from the most recent open finding
async function showFound(v) {
  try {
    const r = await fetch(`/api/v1/vulns/${encodeURIComponent(vulnId)}/findings?status=active&sort=last_seen&order=desc&limit=1`, { headers: { Accept: 'application/json' } });
    const f = r.ok ? ((await r.json()).findings || [])[0] : null;
    if (!f || !f.details) return;
    $('v-found').innerHTML = AssetDetail.panel({ ...f, title: v.title, vuln_id: vulnId });
    // The tool's headline facts in Details: the advisory's own score next to the grade here, reach, and the fix
    const d = f.details, slot = $('v-info-tool');
    if (slot) {
      const r = d.reachability || {}, p = d.package || {}, k = d.gcr_risk || {};
      slot.innerHTML = [
        d.advisory ? info('Advisory', `<span class="text-mono text-sm">${esc(d.advisory)}</span>`) : '',
        d.advisory_cvss != null ? info('Advisory CVSS', esc(d.advisory_cvss)) : '',
        d.epss != null && v.epss_score == null ? info('EPSS', esc((d.epss * 100).toFixed(2) + '%')) : '',
        d.kev ? info('Known exploited', '<span class="chip chip--critical">KEV</span>') : '',
        k.score != null ? info('Risk in GitHub Code Review', `<b>${esc(k.score)}</b> of 100${k.likelihood ? ` <span class="text-sm text-muted">likelihood ${esc(k.likelihood)}, impact ${esc(k.impact || '?')}</span>` : ''}`) : '',
        r.verdict ? info('Reachable', `${esc(r.verdict)}${r.direct ? ` <span class="text-sm text-muted">${esc(r.direct)}${r.scope ? `, ${esc(r.scope)}` : ''}</span>` : ''}`) : '',
        p.name ? info('Package', `<span class="text-mono text-sm">${esc(p.name)}${p.version ? `@${esc(p.version)}` : ''}</span>${p.ecosystem ? ` <span class="text-sm text-muted">${esc(p.ecosystem)}</span>` : ''}`) : '',
        p.fixed_in ? info('Fixed in', `<span class="text-mono text-sm">${esc(p.fixed_in)}</span>`) : '',
        d.grade && d.grade.engine_severity && d.grade.engine_severity !== d.grade.severity ? info('Grade changed', `the scanner said <b>${esc(d.grade.engine_severity)}</b>${d.grade.source_label ? ` <span class="text-sm text-muted">set by ${esc(d.grade.source_label)}</span>` : ''}`) : '',
        d.gcr_exception ? info('In GitHub Code Review', esc(d.gcr_exception.source === 'exclusion' ? 'Excluded by a rule' : `Waiver ${d.gcr_exception.status || ''}`.trim())) : '',
        d.validation && d.validation.rating ? info('Validation', `${esc(d.validation.rating)}${d.validation.confidence ? ` <span class="text-sm text-muted">${esc(d.validation.confidence)} confidence</span>` : ''}`) : '',
      ].join('');
    }
    $('v-found-where').textContent = f.hostname ? `Most recent: ${f.hostname}` : '';
    $('v-found-panel').hidden = false;
  } catch (e) { /* the page works without it */ }
}

function notFound() {
  $('v-title').textContent = 'Vulnerability not found';
  $('v-info-panel').style.display = 'none';
  $('v-affected-panel').style.display = 'none';
}

let table, vdomain = 'infra', vtitle = '', vkev = false;
function startAffected() {
  const base = `/api/v1/vulns/${encodeURIComponent(vulnId)}/findings`;
  const dim = (f, html) => f.contained ? `<span style="opacity:.45">${html}</span>` : html;
  const dev = f => `/devices/${encodeURIComponent(f.device_id)}`;
  table = DataTable.create({
    mount: $('affected-table'),
    endpoint: base,
    exportUrl: `${base}/export`,
    listKey: 'findings',
    defaultSort: 'risk_score',
    defaultOrder: 'desc',
    emptyText: `No ${AssetDetail.affectedLabel(vdomain).toLowerCase()} with this status`,
    rowHref: f => (vdomain === 'infra' ? dev(f) : null),
    params: () => ({ status: $('a-status').value, q: $('a-search').value.trim(), tag: TagFocus.get() }),
    onLoad: () => syncPicks && syncPicks(),
    columns: vdomain !== 'infra' ? [
      ...(canExcept ? [{ label: 'Select', head: CtemFindings.PICK_HEAD, render: f => ['open', 'in_progress'].includes(f.status)
        ? `<input type="checkbox" data-pick="${esc(f.id)}" aria-label="Select ${esc(f.hostname)}"${picked.has(f.id) ? ' checked' : ''}>` : '' }] : []),
      ...AssetDetail.affectedColumns(vdomain, { dim, R, dev }),
    ] : [
      ...(canExcept ? [{ label: 'Select', head: CtemFindings.PICK_HEAD, render: f => ['open', 'in_progress'].includes(f.status)
        ? `<input type="checkbox" data-pick="${esc(f.id)}" aria-label="Select ${esc(f.hostname)}"${picked.has(f.id) ? ' checked' : ''}>` : '' }] : []),
      { label: 'Hostname', sort: 'hostname', render: f => dim(f, R.link(dev(f), f.hostname)) + (f.contained ? ' <span class="chip chip--info" style="font-size:.7rem">Contained</span>' : '')
        + R.foundBy(f) },
      { label: 'Severity', render: f => `<span class="chip chip--${esc(f.severity)}" style="font-size:.7rem">${esc(f.severity === 'info' ? 'Info' : f.severity)}</span>` },
      { label: 'Reach', render: f => dim(f, R.reach(f)) },
      { label: 'User', sort: 'user', render: f => dim(f, txt(f.user)) },
      { label: 'IP', render: f => dim(f, `<span class="text-mono text-sm">${txt(f.ip)}</span>`) },
      { label: 'OS', sort: 'os', render: f => dim(f, `<span class="text-sm">${txt((f.os || '').slice(0, 28) || null)}</span>`) },
      { label: 'Grade', sort: 'risk_grade', firstOrder: 'desc', render: f => dim(f, R.grade(f.device_grade)) },
      { label: 'Device score', sort: 'risk_score', firstOrder: 'desc', render: f => dim(f, R.score(f.device_score)) + (f.contained ? ' ' + R.adjusted(f.raw_device_grade, f.raw_device_score, f.device_grade, f.device_score) : '') },
      { label: 'Status', sort: 'status', render: f => dim(f, f.exception_id
        ? `<a class="chip chip--info" style="font-size:.7rem" href="/exceptions?id=${encodeURIComponent(f.exception_id)}">Excepted</a>`
        : `<span class="text-sm">${esc(f.status.replace('_', ' '))}</span>`) },
      { label: 'First detected', sort: 'first_detected', firstOrder: 'desc', render: f => dim(f, R.date(f.first_detected)) },
      { label: 'Age', sort: 'age', firstOrder: 'desc', render: f => dim(f, R.age(f)) },
      { label: 'Last seen', sort: 'last_seen', firstOrder: 'desc', render: f => dim(f, R.date(f.last_seen)) },
      { label: '', render: f => `<span style="display:flex;gap:4px">${['rapid7_insightvm', 'tanium'].includes(f.source) ? `<button type="button" class="btn btn--ghost btn--sm" data-proof="${esc(f.id)}" data-host="${esc(f.hostname)}">Proof</button>` : ''}<button type="button" class="btn btn--ghost btn--sm" data-ticket="${esc(f.id)}" data-host="${esc(f.hostname)}">Ticket</button></span>` },
    ],
  });
}

$('affected-table').addEventListener('click', e => {
  const dt = e.target.closest('button[data-detail]');   // Code and Web app findings: where it is and how to fix it
  if (dt) {
    const row = (table ? table.rows() : []).find(r => r.id === dt.dataset.detail);
    if (row) AssetDetail.open({ ...row, title: vtitle, vuln_id: vulnId, is_kev: vkev });
    return;
  }
  const b = e.target.closest('button[data-ticket]');
  if (b) openTicketModal(vulnId, `${$('v-title').textContent} on ${b.dataset.host}`, b.dataset.ticket);
  const p = e.target.closest('button[data-proof]');
  if (p) CtemFindings.proof(p.dataset.proof, `${$('v-title').textContent} on ${p.dataset.host}`);
});

// Exceptions and false positives: admin and cyber create them for the ticked assets (or all, or a tag); anyone
// else who can see them sends a request that cyber or an admin approves
let canExcept = false, canDecide = false;
const picked = new Map();   // finding id -> {id: device id, hostname}
function pickedLabel() {
  const n = picked.size ? ` (${picked.size})` : '';
  $('ex-btn').disabled = !picked.size;
  $('fp-btn').disabled = !picked.size;
  $('ex-btn').textContent = `${canDecide ? 'Create' : 'Request'} exception${n}`;
  $('fp-btn').textContent = `${canDecide ? 'False positive' : 'Report false positive'}${n}`;
}
const syncPicks = CtemFindings.picker({
  mount: $('affected-table'), rows: () => (table ? table.rows() : []), picked, onChange: pickedLabel,
  entry: row => ({ id: row.device_id, hostname: row.hostname }),
});
const openForm = kind => CtemFindings.exceptionForm({
  vulnId, label: $('v-title').textContent, devices: [...picked.values()], canDecide, kind,
  onDone: () => { picked.clear(); pickedLabel(); table && table.reload(); },
});
$('ex-btn').addEventListener('click', () => openForm('exception'));
$('fp-btn').addEventListener('click', () => openForm('false_positive'));

let timer;
$('a-search').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => table && table.reload(), 300); });
$('a-status').addEventListener('change', () => table && table.reload());
// Viewing through a tag (from the dashboard or device pages): only those devices are listed and counted
TagFocus.chips($('tag-focus'), 'Viewing');
window.addEventListener('tag-focus-changed', () => { loadVuln(); table && table.reload(); });
fetch('/api/v1/exceptions/summary', { headers: { Accept: 'application/json' } })
  .then(r => (r.ok ? r.json() : null)).catch(() => null)
  .then(s => {
    canExcept = !!s;
    canDecide = !!(s && s.can_decide);
    $('ex-btn').hidden = $('fp-btn').hidden = !canExcept;
    pickedLabel();
    loadVuln();
  });
</script>
{% endblock %}
