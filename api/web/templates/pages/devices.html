{% extends "base.html" %}
{% set active_nav = 'devices' %}

{% block title %}Devices -- open-ctem{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-header__title">Device Inventory</h1>
    <p class="page-header__sub">All managed assets across your environment</p>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div class="search-bar-wrap">
      <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input id="search-input" type="search" class="search-bar" placeholder="Hostname, user, IP, or MAC"
        autocomplete="off" spellcheck="false" aria-label="Search devices">
    </div>
    <select id="filter-grade" class="filter-select" aria-label="Grade">
      <option value="">All grades</option>
      <option value="F">F -- Critical</option>
      <option value="D">D -- High</option>
      <option value="C">C -- Medium</option>
      <option value="B">B -- Low</option>
      <option value="A">A -- Minimal</option>
      <option value="none">Not scored</option>
    </select>
    <select id="filter-type" class="filter-select" aria-label="Device type">
      <option value="">All types</option>
      <option value="server">Server</option>
      <option value="workstation">Workstation</option>
      <option value="network_device">Network device</option>
      <option value="cloud_instance">Cloud instance</option>
      <option value="unknown">Unknown</option>
    </select>
    <select id="filter-status" class="filter-select" aria-label="Inventory status">
      <option value="">Any status</option>
      <option value="assigned">Assigned</option>
      <option value="shipped">Shipped</option>
      <option value="lost">Lost</option>
      <option value="stolen">Stolen</option>
      <option value="returned">Returned</option>
      <option value="contained">Contained</option>
      <option value="edr_hidden">Hidden in EDR</option>
      <option value="out_of_scope">Not in scope</option>
    </select>
    <select id="filter-source" class="filter-select" aria-label="Source">
      <option value="">All sources</option>
      <option value="crowdstrike">CrowdStrike (CS)</option>
      <option value="rapid7_insightvm">Rapid7 InsightVM (R7)</option>
      <option value="rapid7_appsec">Rapid7 AppSec</option>
      <option value="rapid7_cloudsec">Rapid7 CloudSec</option>
      <option value="ldap">Active Directory (AD)</option>
    </select>
  </div>
</div>

<div id="tag-filters" class="filter-bar" hidden style="margin-bottom:8px"></div>
<div class="panel" style="padding:0" id="devices-table"></div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ static('js/data_table.js') }}"></script>
<script src="{{ static('js/device_assign.js') }}"></script>
<script>
const R = DataTable.R;
const $ = id => document.getElementById(id);
// Small line icons so the Type column reads at a glance
const TYPE_ICONS = {
  server: ['Server', '<rect x="3" y="3" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="18" height="7" rx="1.5"/><path d="M7 6.5h.01M7 17.5h.01"/>'],
  workstation: ['Workstation', '<rect x="2.5" y="4" width="19" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/>'],
  network_device: ['Network device', '<rect x="2.5" y="13" width="19" height="7" rx="1.5"/><path d="M6.5 16.5h.01M10 16.5h.01M12 13V8M8.5 6.5a5 5 0 0 1 7 0"/>'],
  cloud_instance: ['Cloud instance', '<path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 9.5 4.25 4.25 0 0 0 7 18z"/>'],
  unknown: ['Unknown', '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/>'],
};
function typeIcon(t) {
  const [label, path] = TYPE_ICONS[t] || TYPE_ICONS.unknown;
  return `<span title="${esc(label)}" aria-label="${esc(label)}" style="display:inline-flex;color:var(--text-muted, currentColor)">`
    + `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg></span>`;
}

// Who's on it; assigning and the details live on the device page
function userCell(d) {
  if (d.assigned_user) return `<span style="color:var(--severity-low)" title="Assigned">&#10003;</span> ${esc(d.assigned_user.name)}`;
  return d.user ? esc(d.user) : '<span class="text-muted">--</span>';
}

const FILTERS = { q: 'search-input', grade: 'filter-grade', device_type: 'filter-type', source: 'filter-source', status: 'filter-status' };

// Prefill from the URL so dashboard cards and shared links land on a filtered view
const initial = new URLSearchParams(location.search);
Object.entries(FILTERS).forEach(([k, id]) => { if (initial.get(k)) $(id).value = initial.get(k); });
// Tag filters (owner, application, environment) come from the link or the tab's tag focus, and stay with you
if (initial.getAll('tag').length) TagFocus.set(initial.getAll('tag'));

function normalizeMac(input) {
  const raw = input.replace(/[:\-. ]/g, '').toUpperCase();
  return /^[0-9A-F]{12}$/.test(raw) ? raw.match(/.{2}/g).join(':') : null;
}

const table = DataTable.create({
  mount: $('devices-table'),
  endpoint: '/api/v1/devices',
  exportUrl: '/api/v1/devices/export',
  listKey: 'devices',
  defaultSort: 'risk_score',
  defaultOrder: 'desc',
  syncUrl: true,
  emptyText: 'No devices match these filters',
  rowHref: d => `/devices/${encodeURIComponent(d.id)}`,
  params: () => {
    const q = $('search-input').value.trim();
    return { q: normalizeMac(q) || q, grade: $('filter-grade').value,
             device_type: $('filter-type').value, source: $('filter-source').value, status: $('filter-status').value,
             tag: TagFocus.get() };
  },
  columns: [
    { label: 'Hostname', sort: 'hostname', render: d => `<span title="${esc(d.fqdn || d.hostname)}">${R.link(`/devices/${encodeURIComponent(d.id)}`, d.hostname)}</span> ${DeviceAssign.statusChip(d.inventory_status)}${d.out_of_scope_until ? ' <span class="chip chip--medium" style="font-size:.7rem" title="Its vulnerabilities don\'t count">Not in scope</span>' : ''}` },
    { label: 'User', sort: 'user', render: userCell },
    { label: 'IP', render: d => `<span class="text-mono text-sm">${esc(d.ip || '--')}</span>` },
    { label: 'Type', sort: 'device_type', render: d => typeIcon(d.device_type) },
    { label: 'OS', sort: 'os', render: d => `<span class="text-sm" title="${esc(d.os || '')}">${esc((d.os || '--').slice(0, 28))}</span>` },
    { label: 'Grade', sort: 'risk_grade', firstOrder: 'desc', render: d => R.grade(d.risk_grade) },
    { label: 'Score', sort: 'risk_score', firstOrder: 'desc', render: d => R.score(d.risk_score) + ((d.edr_contained || d.out_of_scope_until) ? ' ' + R.adjusted(d.raw_risk_grade, d.raw_risk_score, d.risk_grade, d.risk_score) : '') },
    { label: 'Open', sort: 'open_findings', firstOrder: 'desc', render: d => R.num(d.open_findings) },
    { label: 'KEV', sort: 'kev_findings', firstOrder: 'desc', render: d => d.kev_findings ? `<span class="chip chip--critical">${R.num(d.kev_findings)}</span>` : '0' },
    { label: 'Last seen', sort: 'last_seen', firstOrder: 'desc', render: d => R.seenAgo(d) },
    { label: 'EDR', sort: 'edr_active', render: d => R.bool(d.edr_active) + (d.edr_contained ? ' <span class="chip chip--info" style="font-size:.7rem">Contained</span>' : '')
      + (d.edr_hidden ? ' <span class="chip chip--medium" style="font-size:.7rem" title="Hidden in the EDR console">Hidden</span>' : '') },
    { label: 'Host FW', sort: 'firewall_enabled', render: d => d.firewall_enabled == null ? '<span class="text-muted" title="Unknown">--</span>' : R.bool(d.firewall_enabled) },
    { label: 'USB block', sort: 'usb_storage_blocked', render: d => d.usb_storage_blocked == null ? '<span class="text-muted" title="Unknown">--</span>' : R.bool(d.usb_storage_blocked) },
    { label: 'Sources', render: d => (d.sources || []).map(c => `<span class="chip chip--info" style="font-size:.7rem">${esc(c)}</span>`).join(' ') || '<span class="text-muted">--</span>' },
    { label: 'Tags', render: d => (d.tags || []).slice(0, 3).map(t => `<span class="chip chip--info" style="font-size:.7rem">${esc(t.split(':').pop().trim().toUpperCase())}</span>`).join(' ')
        + ((d.tags || []).length > 3 ? ` <span class="text-muted text-sm">+${d.tags.length - 3}</span>` : '') },
  ],
});

let timer;
$('search-input').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => table.reload(), 300); });
['filter-grade', 'filter-type', 'filter-source', 'filter-status'].forEach(id => $(id).addEventListener('change', () => table.reload()));
TagFocus.chips($('tag-filters'), 'Tag');
window.addEventListener('tag-focus-changed', () => table.reload());
</script>
{% endblock %}
